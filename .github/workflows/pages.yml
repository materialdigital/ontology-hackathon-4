name: Build protocol PDF and deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "protocol/**"
      - "resources/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended
      - name: Build protocol PDF
        run: |
          mkdir -p site/assets/resources
          pandoc protocol/protocol.md             --from=gfm             --pdf-engine=xelatex             -V geometry:margin=2.2cm             -V mainfont="DejaVu Sans"             -V colorlinks=true             -V title="4th PMD Hackathon: Protocol"             -o site/assets/resources/hackathon-protocol.pdf
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
